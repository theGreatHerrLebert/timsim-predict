[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timsim-predict"
version = "0.1.0"
description = "timsim v2 prediction CLI jobs (CCS, RT, MS2 fragment intensity) — parquet I/O over the pepdl predictors. The pipeline's prediction step, free of imspy dead weight."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pepdl @ git+https://github.com/theGreatHerrLebert/pepdl.git", "numpy>=1.21", "pandas>=1.3", "pyarrow>=13"]

[project.optional-dependencies]
local = ["pepdl[local]"]
koina = ["pepdl[koina]"]

[project.scripts]
timsim-ccs = "timsim_predict.ccs:main"
timsim-rt = "timsim_predict.rt:main"
timsim-fragments = "timsim_predict.fragments:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/timsim_predict"]
